<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>M&amp;O</title>

  <style>
    /* ---------- 基础 ---------- */
    :root {
      --ink: #1f2430;
      --muted: #7a8296;
      --line: #d9dee8;
      --brand: #4f7cff;
      --ok: #1f9d55;
      --bad: #d64545;
      --warn: #b26a00;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      padding: 40px 20px 60px;
      background: #f5f7fb;
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    .game { width: 100%; max-width: 560px; }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: 2px;
    }

    .subtitle {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    /* ---------- 顶部信息 ---------- */
    .hud {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      margin-bottom: 18px;
      font-size: 14px;
      color: var(--muted);
      align-items: center;
    }

    .hud b {
      color: var(--ink);
      font-size: 17px;
      margin: 0 2px;
    }

    .lives {
      letter-spacing: 2px;
      font-size: 17px;
      color: #e2557b;
    }

    .lives .off { color: #d7dbe4; }

    .restart {
      margin-left: auto;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
    }

    .restart:hover { color: var(--ink); border-color: #b9c2d4; }

    /* ---------- 方块 ---------- */
    .hint {
      margin-bottom: 10px;
      font-size: 14px;
      color: var(--muted);
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: nowrap;
    }

    .cell {
      flex: 1 1 0;
      min-width: 0;
      max-width: 56px;
      aspect-ratio: 1 / 1;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(15px, 4.2vw, 26px);
      font-weight: 700;
      transition: border-color .15s, background .15s;
    }

    .cell.given {
      border-color: var(--brand);
      background: #eef3ff;
      color: var(--brand);
    }

    /* ---------- 输入区 ---------- */
    .input-line {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input {
      flex: 1 1 180px;
      min-width: 0;
      padding: 12px 14px;
      font-size: 17px;
      font-family: inherit;
      border: 2px solid var(--line);
      border-radius: 10px;
      outline: none;
      background: #fff;
    }

    input:focus { border-color: var(--brand); }

    button {
      padding: 12px 20px;
      font-size: 16px;
      font-family: inherit;
      border: none;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:hover { background: #3f68e0; }
    button:disabled { opacity: .45; cursor: default; }

    button.ghost {
      background: #fff;
      color: var(--warn);
      border: 2px solid #f0d9b8;
    }

    button.ghost:hover { background: #fff7ea; }
    button.ghost:disabled { background: #fff; }

    /* ---------- 提示条 / 释义 ---------- */
    #msg {
      min-height: 24px;
      margin-top: 12px;
      font-size: 15px;
      line-height: 1.5;
    }

    #msg.ok { color: var(--ok); }
    #msg.bad { color: var(--bad); }
    #msg.info { color: var(--warn); }

    .def {
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f0f5ff;
      border-left: 3px solid var(--brand);
      display: none;
    }

    .def.on { display: block; }

    .def .word {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .5px;
      margin-right: 8px;
    }

    .def .zh {
      font-size: 15px;
      color: #33415c;
      line-height: 1.6;
    }

    .def .none { color: var(--muted); font-size: 14px; }

    .hintbox {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      background: #fff7ea;
      border: 1px dashed #e8c78f;
      font-size: 15px;
      color: #8a5a00;
      line-height: 1.6;
    }

    .hintbox b {
      font-size: 19px;
      letter-spacing: .5px;
      margin: 0 3px;
    }

    /* ---------- 单词本 ---------- */
    .book {
      margin-top: 24px;
      border-top: 1px solid var(--line);
      padding-top: 12px;
      font-size: 14px;
      color: var(--muted);
    }

    .book summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--ink);
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }

    .book summary::-webkit-details-marker { display: none; }
    .book summary::after {
      content: "展开";
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
    }
    .book[open] summary::after { content: "收起"; }

    .book-list { margin-top: 10px; }

    .book-row {
      padding: 8px 0;
      border-bottom: 1px dashed #e6eaf2;
      line-height: 1.5;
    }

    .book-row:last-child { border-bottom: none; }

    .book-head {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .book-word {
      font-weight: 700;
      color: var(--ink);
      font-size: 15px;
      cursor: pointer;
    }

    .book-word:hover { color: var(--brand); }

    .book-count {
      font-size: 12px;
      color: var(--brand);
    }

    .book-def {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    .book-empty { font-size: 13px; color: var(--muted); }

    /* ---------- 历史 ---------- */
    #history {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.9;
      color: var(--muted);
      word-break: break-all;
    }

    .foot {
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
      line-height: 1.8;
    }

    /* ---------- 结束弹层 ---------- */
    .over {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(20, 26, 40, .45);
      backdrop-filter: blur(3px);
      z-index: 10;
    }

    .over[hidden] { display: none; }

    .over-card {
      width: 100%;
      max-width: 340px;
      padding: 28px 24px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 24px 60px rgba(20, 30, 60, .25);
      text-align: center;
    }

    .over-card h2 {
      margin: 0 0 18px;
      font-size: 22px;
      letter-spacing: 2px;
    }

    .over-card p {
      margin: 6px 0;
      font-size: 15px;
      color: var(--muted);
    }

    .over-card p b {
      font-size: 22px;
      color: var(--ink);
      margin-left: 4px;
    }

    .over-card .new-record {
      color: var(--warn);
      font-weight: 700;
      margin: 10px 0 0;
    }

    .over-card button {
      margin-top: 20px;
      width: 100%;
      padding: 13px;
    }

    /* ---------- 小屏 ---------- */
    @media (max-width: 440px) {
      body { padding: 24px 14px 48px; }
      h1 { font-size: 24px; }
      .row { gap: 8px; }
      .hud { gap: 8px 14px; }
      input { flex-basis: 100%; }
      .input-line button { flex: 1 1 0; }
    }

    /* 很窄的旧手机（320px）也要放得下 6 个方块 */
    @media (max-width: 360px) {
      .row { gap: 6px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="game">
    <h1>M&amp;O</h1>
    <p class="subtitle">用上一个词的尾字母，接出下一个词。卡住可以点「提示」，代价是 1 条命。</p>

    <div class="hud">
      <span>第 <b id="round">1</b> 回合</span>
      <span>得分 <b id="score">0</b></span>
      <span>最高 <b id="best">0</b></span>
      <span class="lives" id="lives"></span>
      <button class="restart" id="restart" type="button">重开</button>
    </div>

    <div class="hint" id="hint">请输入 4 个字母，以 g 开头</div>

    <!-- 方块由 JS 按当前词长生成 -->
    <div class="row" id="row"></div>

    <div class="input-line">
      <input id="answer" type="text" placeholder="输入单词后按回车"
             autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
      <button id="submit" type="button">提交</button>
      <button id="hintBtn" class="ghost" type="button">提示 −1 命</button>
    </div>

    <div id="msg"></div>

    <!-- 上一个词的释义 -->
    <div id="def" class="def">
      <div><span class="word" id="defWord"></span><span class="zh" id="defZh"></span></div>
    </div>

    <div id="hintbox" class="hintbox" hidden></div>

    <details class="book" id="book">
      <summary>单词本 <span id="bookCount">（0 个）</span></summary>
      <div class="book-list" id="bookList"></div>
    </details>

    <div id="history"></div>

    <div class="foot" id="foot"></div>
  </div>

  <div class="over" id="over" hidden>
    <div class="over-card">
      <h2>游戏结束</h2>
      <p>本局得分<b id="finalScore">0</b></p>
      <p>本机最高<b id="finalBest">0</b></p>
      <p class="new-record" id="newRecord" hidden>🎉 新纪录</p>
      <button id="again" type="button">再来一局</button>
    </div>
  </div>

  <script>
    'use strict';

    /* ================================================================
       1. 存档
       ================================================================ */
    const KEY_BEST = 'wc-best';
    const KEY_BOOK = 'wc-book';
    const KEY_SAVE = 'wc-save';     // 未结束的进度

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveJSON(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) { /* 隐私模式 / 文件协议下可能不可用 */ }
    }

    function removeKey(key) {
      try { localStorage.removeItem(key); } catch (e) { /* ignore */ }
    }

    /* ================================================================
       2. 释义数据（可选：words.js 里带 DEFS 才有）
       ================================================================ */
    const DEFS = (typeof globalThis.DEFS === 'object' && globalThis.DEFS) ? globalThis.DEFS : {};

    /* ================================================================
       3. 状态
       ================================================================ */
    const state = {
      round: 1,
      score: 0,
      lives: 3,
      length: 4,
      letter: 'g',
      history: [],       // 本局用过的词
      hintWord: '',      // 本题提示出来的词
      over: false,
      best: loadJSON(KEY_BEST, 0),
      startBest: 0,
      book: loadJSON(KEY_BOOK, {})   // { word: 复习次数 }
    };

    const LETTERS = 'abcdefghijklmnopqrstuvwxyz'.split('').filter(c => !'xqz'.includes(c));
    const $ = id => document.getElementById(id);

    /* ================================================================
       4. 词库索引
       ================================================================ */
    const DICT = new Set(WORDS);

    const BY_FIRST = {};
    for (const w of WORDS) {
      const c = w[0];
      (BY_FIRST[c] = BY_FIRST[c] || []).push(w);
    }

    /* ================================================================
       5. 工具函数
       ================================================================ */
    function availableWords(letter, len, used) {
      const list = BY_FIRST[letter] || [];
      return list.filter(w => w.length === len && used.indexOf(w) === -1);
    }

    function pickLength(letter, prevLen, used) {
      const lens = [3, 4, 5, 6, 7, 8];

      const review = lens.filter(l =>
        l !== prevLen &&
        availableWords(letter, l, used).some(w => state.book[w])
      );
      if (review.length && Math.random() < 0.6) {
        return review[Math.floor(Math.random() * review.length)];
      }

      let options = lens.filter(l => l !== prevLen && availableWords(letter, l, used).length > 0);
      if (options.length === 0) {
        options = lens.filter(l => availableWords(letter, l, used).length > 0);
      }
      if (options.length === 0) return 0;
      return options[Math.floor(Math.random() * options.length)];
    }

    function addToBook(word) {
      if (!state.book[word]) state.book[word] = 0;
      saveJSON(KEY_BOOK, state.book);
    }

    function defOf(word) {
      return DEFS[word] || '';
    }

    /* ================================================================
       6. 进度存档：每一回合都写一次，刷新/退出后能接着玩
       ================================================================ */
    let saveTimer = null;

    function saveProgress() {
      if (state.over) return;
      const data = {
        round: state.round,
        score: state.score,
        lives: state.lives,
        length: state.length,
        letter: state.letter,
        history: state.history,
        hintWord: state.hintWord,
        ts: Date.now()
      };
      saveJSON(KEY_SAVE, data);
    }

    function saveProgressSoon() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveProgress, 250);
    }

    // 从存档恢复；返回 true 表示恢复成功
    function restoreProgress() {
      const d = loadJSON(KEY_SAVE, null);
      if (!d || typeof d !== 'object') return false;

      const ok =
        Number.isInteger(d.round) && d.round >= 1 &&
        Number.isInteger(d.score) && d.score >= 0 &&
        Number.isInteger(d.lives) && d.lives >= 1 && d.lives <= 3 &&
        Number.isInteger(d.length) && d.length >= 3 && d.length <= 8 &&
        typeof d.letter === 'string' && /^[a-z]$/.test(d.letter) &&
        Array.isArray(d.history) && d.history.every(w => typeof w === 'string');

      if (!ok) return false;

      // 存档里的题目必须还有可接的词，否则判为失效
      if (availableWords(d.letter, d.length, d.history).length === 0) return false;

      state.round = d.round;
      state.score = d.score;
      state.lives = d.lives;
      state.length = d.length;
      state.letter = d.letter;
      state.history = d.history.slice();
      state.hintWord = (typeof d.hintWord === 'string') ? d.hintWord : '';
      if (state.hintWord && !availableWords(state.letter, state.length, state.history).includes(state.hintWord)) {
        state.hintWord = '';
      }
      return true;
    }

    /* ================================================================
       7. 渲染
       ================================================================ */
    function render() {
      $('round').textContent = state.round;
      $('score').textContent = state.score;
      $('best').textContent = Math.max(state.best, state.score);

      const livesEl = $('lives');
      livesEl.textContent = '';
      for (let i = 0; i < 3; i++) {
        const s = document.createElement('span');
        s.textContent = '♥';
        if (i >= state.lives) s.className = 'off';
        livesEl.appendChild(s);
      }

      $('hint').textContent =
        '请输入 ' + state.length + ' 个字母，以 ' + state.letter + ' 开头';

      const row = $('row');
      row.textContent = '';
      for (let i = 0; i < state.length; i++) {
        const cell = document.createElement('div');
        cell.className = i === 0 ? 'cell given' : 'cell';
        cell.textContent = i === 0 ? state.letter : '';
        row.appendChild(cell);
      }

      // 提示框
      const hb = $('hintbox');
      if (state.hintWord) {
        hb.hidden = false;
        hb.textContent = '';
        hb.appendChild(document.createTextNode('提示：'));
        const b = document.createElement('b');
        b.textContent = state.hintWord;
        hb.appendChild(b);
        const zh = defOf(state.hintWord);
        hb.appendChild(document.createTextNode(zh ? '　' + zh : ''));
      } else {
        hb.hidden = true;
        hb.textContent = '';
      }

      // 上一个词的释义
      renderDef();

      $('hintBtn').disabled = !!(state.hintWord || state.over);
      $('submit').disabled = state.over;

      // 单词本
      const words = Object.keys(state.book).sort((a, b) => state.book[b] - state.book[a]);
      $('bookCount').textContent = '（' + words.length + ' 个）';
      const list = $('bookList');
      list.textContent = '';
      if (words.length === 0) {
        const p = document.createElement('div');
        p.className = 'book-empty';
        p.textContent = '用「提示」看过的词会自动收进来，以后会优先变成复习题。';
        list.appendChild(p);
      } else {
        for (const w of words) {
          const rowEl = document.createElement('div');
          rowEl.className = 'book-row';

          const head = document.createElement('div');
          head.className = 'book-head';

          const wordEl = document.createElement('span');
          wordEl.className = 'book-word';
          wordEl.textContent = w;
          wordEl.addEventListener('click', function () { speak(w); });

          head.appendChild(wordEl);

          if (state.book[w] > 0) {
            const cnt = document.createElement('span');
            cnt.className = 'book-count';
            cnt.textContent = '×' + state.book[w];
            head.appendChild(cnt);
          }

          const defEl = document.createElement('div');
          defEl.className = 'book-def';
          defEl.textContent = defOf(w) || '暂无中文释义';

          rowEl.appendChild(head);
          rowEl.appendChild(defEl);
          list.appendChild(rowEl);
        }
      }

      $('history').textContent = state.history.length
        ? '已完成：' + state.history.join(' → ')
        : '';

      const hasZh = Object.keys(DEFS).length > 0;
      $('foot').textContent =
        '词库 ' + WORDS.length + ' 个常用英文词（3–8 个字母）' +
        (hasZh ? ' · 释义 ' + Object.keys(DEFS).length + ' 条' : '') +
        ' · 最高分和进度都存在本机浏览器里';

      // 结束弹层
      const over = $('over');
      over.hidden = !state.over;
      if (state.over) {
        $('finalScore').textContent = state.score;
        $('finalBest').textContent = state.best;
        $('newRecord').hidden = !state.isNewRecord;
      }
    }

    // 上一个词的释义卡片
    let lastDefWord = '';

    function renderDef() {
      if (!lastDefWord) {
        $('def').className = 'def';
        return;
      }
      const zh = defOf(lastDefWord);
      $('def').className = 'def on';
      $('defWord').textContent = lastDefWord;
      const zhEl = $('defZh');
      zhEl.textContent = zh || '暂无中文释义';
      zhEl.className = zh ? 'zh' : 'zh none';
    }

    function showDef(word) {
      lastDefWord = word;
      renderDef();
    }

    /* ================================================================
       8. 提示条
       ================================================================ */
    let msgTimer = null;

    function showMessage(text, kind) {
      const el = $('msg');
      el.textContent = text;
      el.className = kind || '';
      clearTimeout(msgTimer);
      msgTimer = setTimeout(() => {
        el.textContent = '';
        el.className = '';
      }, 3600);
    }

    /* ================================================================
       9. 校验
       ================================================================ */
    function checkWord(raw, s) {
      const word = raw.trim().toLowerCase();

      if (!word) return { ok: false, reason: '先输入一个单词' };
      if (!/^[a-z]+$/.test(word)) return { ok: false, reason: '只能输入英文字母 a–z' };
      if (word.length !== s.length) {
        return { ok: false, reason: '需要 ' + s.length + ' 个字母，你输入了 ' + word.length + ' 个' };
      }
      if (word[0] !== s.letter) return { ok: false, reason: '要以 ' + s.letter + ' 开头' };
      if (!DICT.has(word)) return { ok: false, reason: '词库里没有 “' + word + '”，换一个常用词试试' };
      if (s.history.includes(word)) return { ok: false, reason: '“' + word + '” 已经用过了' };
      return { ok: true, word: word };
    }

    /* ================================================================
       10. 提示
       ================================================================ */
    function useHint() {
      if (state.over || state.hintWord) return;

      const list = availableWords(state.letter, state.length, state.history);
      if (list.length === 0) {
        showMessage('这题没有可提示的词了，换一题试试', 'info');
        return;
      }

      const inBook = list.filter(w => state.book[w]);
      const pool = inBook.length ? inBook : list;
      const word = pool[Math.floor(Math.random() * pool.length)];

      state.hintWord = word;
      addToBook(word);
      state.lives -= 1;

      if (state.lives <= 0) {
        showMessage('提示用掉了最后一条命', 'bad');
        gameOver();
      } else {
        const zh = defOf(word);
        showMessage('提示：' + word + (zh ? '（' + zh + '）' : '') + ' −1 命', 'info');
      }
      render();
      saveProgress();
    }

    /* ================================================================
       11. 结束 / 重开
       ================================================================ */
    function gameOver() {
      state.over = true;
      state.isNewRecord = state.score > state.startBest;
      if (state.score > state.best) {
        state.best = state.score;
        saveJSON(KEY_BEST, state.best);
      }
      removeKey(KEY_SAVE);
      $('answer').blur();
      render();
    }

    function restart(quiet) {
      state.round = 1;
      state.score = 0;
      state.lives = 3;
      state.history = [];
      state.hintWord = '';
      state.over = false;
      state.isNewRecord = false;
      state.startBest = state.best;
      state.length = 4;
      state.letter = LETTERS[Math.floor(Math.random() * LETTERS.length)];

      lastDefWord = '';
      $('answer').value = '';
      $('msg').textContent = '';
      removeKey(KEY_SAVE);
      render();
      saveProgress();
      if (!quiet) $('answer').focus();
    }

    /* ================================================================
       12. 朗读（点单词本里的词）
       ================================================================ */
    function speak(word) {
      try {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(word);
        u.lang = 'en-US';
        u.rate = 0.85;
        window.speechSynthesis.speak(u);
      } catch (e) { /* 不支持就算了 */ }
    }

    /* ================================================================
       13. 提交
       ================================================================ */
    function submitAnswer() {
      if (state.over) return;

      const input = $('answer');
      const result = checkWord(input.value, state);

      if (!result.ok) {
        showMessage('✗ ' + result.reason, 'bad');
        return;
      }

      const word = result.word;
      const prevLen = state.length;

      state.history.push(word);
      state.score += word.length * 10;

      let reviewBonus = 0;
      if (state.book[word] !== undefined) {
        state.book[word] += 1;
        saveJSON(KEY_BOOK, state.book);
        reviewBonus = 10;
        state.score += reviewBonus;
      }

      if (state.score > state.best) {
        state.best = state.score;
        saveJSON(KEY_BEST, state.best);
      }

      state.round += 1;
      state.hintWord = '';

      const nextLetter = word[word.length - 1];
      let nextLen = pickLength(nextLetter, prevLen, state.history);
      let note = '';

      if (nextLen === 0) {
        const candidates = LETTERS.filter(ch => pickLength(ch, prevLen, state.history) > 0);
        const fallback = candidates[Math.floor(Math.random() * candidates.length)] || 'a';
        nextLen = pickLength(fallback, prevLen, state.history) || 3;
        note = '（以 ' + nextLetter + ' 开头的词用完了，换成 ' + fallback + '）';
        state.letter = fallback;
      } else {
        state.letter = nextLetter;
      }
      state.length = nextLen;

      input.value = '';
      showDef(word);
      render();
      saveProgress();

      const zh = defOf(word);
      showMessage(
        '✓ ' + word + (zh ? '：' + zh : '') + (reviewBonus ? '　复习 +' + reviewBonus : '') +
        '　下一个词以 ' + state.letter + ' 开头' + note,
        'ok'
      );
      input.focus();
    }

    /* ================================================================
       14. 绑定事件 & 开局
       ================================================================ */
    $('submit').addEventListener('click', submitAnswer);

    $('answer').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitAnswer();
      }
    });

    $('hintBtn').addEventListener('click', useHint);
    $('again').addEventListener('click', function () { restart(); });
    $('restart').addEventListener('click', function () {
      if (confirm('重新开始？当前进度会清空。')) restart();
    });

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) saveProgress();
    });
    window.addEventListener('pagehide', saveProgress);
    window.addEventListener('beforeunload', saveProgress);

    state.startBest = state.best;

    const restored = restoreProgress();
    if (restored) {
      lastDefWord = state.history.length ? state.history[state.history.length - 1] : '';
      render();
      showMessage('已恢复上次进度：第 ' + state.round + ' 回合', 'info');
    } else {
      state.letter = LETTERS[Math.floor(Math.random() * LETTERS.length)];
      render();
      saveProgress();
    }
    $('answer').focus();
  </script>
</body>
</html>
